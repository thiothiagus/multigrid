version: "1"
project:
  name: "multi-conta-grid"
  language: "node"
  packageManager: "npm"
  scripts:
    test: "npm test"
    lint: "npm run lint"
    typecheck: "npm run typecheck"
workflow:
  default: feature
quality_gates:
  - name: test
    command: npm test
  - name: lint
    command: npm run lint
  - name: typecheck
    command: npm run typecheck
permissions:
  push: false
  commit: false

logs:
  files:
    - path: logs/errors.jsonl
  ignore_patterns:
    - "Aplicacao iniciada"

refactor:
  max_lines: 500
  ignore_dirs:
    - "node_modules"
    - "dist"
    - ".git"
    - "package-lock.json"
    - "coverage"
