<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!--
  CSP restritiva: essa pagina (a interface do app) so pode carregar
  script/estilo dela mesma, nada externo, nada inline. O conteudo de cada
  conta e desenhado por uma BrowserView nativa por cima desta pagina, entao
  essa CSP nem chega a se aplicar a ele -- e so uma camada extra de
  protecao para a casca do app.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';">
<title>MultiGrid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="toolbar">
    <div id="toolbar-left">
      <span id="toolbar-title">MultiGrid</span>
      <span id="toolbar-version"></span>
    </div>
    <div id="toolbar-actions">
          <select id="layout-preset-select" title="Aplicar preset de layout">
            <option value="" disabled selected>Layout…</option>
          </select>
          <button id="delete-preset-btn" class="hidden" title="Excluir preset personalizado selecionado">&#215;</button>
          <button id="save-preset-btn" title="Salvar layout atual como preset">Salvar layout</button>
          <button id="reset-layout-btn" title="Voltar ao layout automático da grade (padrão)">Resetar layout</button>
          <button id="add-pane-btn" title="Adicionar conta">+ Conta</button>
          <button id="theme-toggle-btn" title="Mudar para tema claro">&#9728;</button>
          <div id="preset-save-box" class="hidden">
            <input type="text" id="preset-name-input" maxlength="40" placeholder="Nome do preset">
            <button id="preset-save-confirm">Salvar</button>
          </div>
      </div>
  </div>

  <div id="setup-screen">
    <div class="setup-box">
      <h1>MultiGrid</h1>
      <p>Quantas contas você quer abrir de uma vez, na mesma janela?</p>

      <label>
        Interface
        <select id="setup-profile">
          <option value="piw" selected>MultiGrid PIW — Poke Idle World</option>
          <option value="generic">MultiGrid genérico — outra URL</option>
        </select>
      </label>

      <label>
        Número de contas
        <input type="number" id="setup-count" min="1" max="9" value="4">
      </label>

      <label>
        URL do site/jogo
        <input type="text" id="setup-url" value="https://poke.idleworld.online/play">
      </label>

      <button id="setup-start-btn">Começar</button>
    </div>
  </div>

  <div id="grid-container"></div>

  <script src="renderer.js" type="module"></script>
</body>
</html>
